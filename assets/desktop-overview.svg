    <text x="988" y="552" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" font-weight="800" fill="#1e293b">系统状态</text>
    <rect x="988" y="578" width="188" height="42" rx="18" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="1012" y="605" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#10966d">已准备开始抽奖</text>
