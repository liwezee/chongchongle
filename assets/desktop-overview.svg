<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="虫虫乐桌面端奖池设置与抽奖记录预览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff3e3"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#35c49f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#8aa0bb" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1100" cy="72" r="120" fill="#d9ecff" opacity=".7"/>
  <circle cx="88" cy="640" r="180" fill="#ffe5c2" opacity=".45"/>
  <text x="52" y="72" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#1c293c">虫虫乐桌面端</text>
  <text x="52" y="108" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" fill="#64748b">奖池配置、现场控制、抽奖记录集中在同一页面</text>
  <g filter="url(#shadow)">
    <rect x="48" y="142" width="248" height="510" rx="28" fill="#ffffff" fill-opacity=".72" stroke="#ffffff" stroke-width="2"/>
    <rect x="78" y="174" width="10" height="34" rx="5" fill="url(#blue)"/>
    <text x="102" y="200" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#1e293b">数量校验</text>
    <text x="78" y="254" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="58" font-weight="800" fill="#1f2937">666</text>
    <rect x="78" y="292" width="188" height="42" rx="18" fill="#e8fff5" stroke="#b8efd7"/>
    <text x="96" y="319" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f9f73">奖项配置有效</text>
    <text x="78" y="392" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" font-weight="800" fill="#1e293b">周期奖励</text>
    <rect x="78" y="418" width="172" height="36" rx="16" fill="#f8fbff" stroke="#d8e2ef"/>
    <text x="94" y="443" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#41516a">每 10 发触发一次</text>
    <text x="78" y="514" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" font-weight="800" fill="#1e293b">现场控制</text>
    <rect x="78" y="542" width="178" height="38" rx="17" fill="#ffffff" stroke="#d5dfec"/>
    <text x="96" y="567" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#41516a">下一发：随机</text>
