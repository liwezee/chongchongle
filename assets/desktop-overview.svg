      <rect x="352" y="326" width="540" height="44" rx="15" fill="#ffffff"/><text x="358" y="354">二等奖</text><text x="456" y="354">二等奖</text><text x="622" y="354">5</text><text x="736" y="354">4</text><text x="824" y="354">2.3574</text>
      <rect x="352" y="378" width="540" height="44" rx="15" fill="#f8fafc"/><text x="358" y="406">三等奖</text><text x="456" y="406">三等奖</text><text x="622" y="406">50</text><text x="736" y="406">49</text><text x="824" y="406">10.2484</text>
      <rect x="352" y="430" width="540" height="44" rx="15" fill="#ffffff"/><text x="358" y="458">四等奖</text><text x="456" y="458">四等奖</text><text x="622" y="458">245</text><text x="736" y="458">243</text><text x="824" y="458">20.5833</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="954" y="142" width="276" height="510" rx="28" fill="#ffffff" fill-opacity=".72" stroke="#ffffff" stroke-width="2"/>
    <text x="988" y="200" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#1e293b">手机控制</text>
    <rect x="988" y="232" width="190" height="40" rx="20" fill="#2f8cff"/>
    <text x="1038" y="258" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#fff">扫码连接</text>
    <rect x="1004" y="306" width="150" height="150" rx="18" fill="#fff" stroke="#dbeafe"/>
    <path d="M1024 326h38v38h-38zM1096 326h38v38h-38zM1024 398h38v38h-38z" fill="#111827"/>
    <path d="M1072 372h12v12h-12zM1094 386h18v18h-18zM1068 414h52v12h-52zM1126 398h10v38h-10z" fill="#111827"/>
