    <text x="356" y="556" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#1e293b">抽奖记录</text>
    <text x="356" y="592" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#64748b">#16 · 二等奖 · 下一发指定命中 · 剩余 4</text>
    <text x="356" y="622" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#64748b">#15 · 四等奖 · 概率命中 · 剩余 243</text>
    <rect x="772" y="586" width="96" height="38" rx="19" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="800" y="611" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#2563eb">下一页</text>
