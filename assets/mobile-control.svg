<svg xmlns="http://www.w3.org/2000/svg" width="520" height="980" viewBox="0 0 520 980" role="img" aria-label="虫虫乐手机控制端预览">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset=".55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#fff4df"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#8aa0bb" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="520" height="980" rx="54" fill="url(#phoneBg)"/>
  <text x="54" y="96" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="32" fill="#0f172a">虫虫乐</text>
  <text x="54" y="150" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="58" font-weight="900" fill="#0f172a">控制端</text>
  <text x="58" y="196" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#64748b">设备连接、抽奖控制和奖池设置</text>
  <circle cx="420" cy="126" r="46" fill="#dbfbe9"/>
  <text x="394" y="145" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="38" font-weight="900" fill="#2f80ed">奖</text>
  <g filter="url(#softShadow)">
    <rect x="42" y="238" width="436" height="176" rx="34" fill="#ffffff" fill-opacity=".78" stroke="#fff" stroke-width="2"/>
    <text x="74" y="296" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#1e293b">已连接电脑端</text>
    <text x="74" y="334" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19" fill="#64748b">剩余 654 发 · 已抽 12 / 666</text>
    <rect x="322" y="292" width="112" height="64" rx="32" fill="#2f80ed"/>
    <text x="350" y="333" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="900" fill="#fff">控制</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="42" y="446" width="436" height="250" rx="34" fill="#ffffff" fill-opacity=".8" stroke="#fff" stroke-width="2"/>
    <text x="74" y="502" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#1e293b">现场控制</text>
    <rect x="74" y="532" width="372" height="58" rx="29" fill="#f8fbff" stroke="#e2e8f0"/>
    <text x="98" y="568" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#334155">下一发：随机</text>
    <rect x="74" y="616" width="178" height="58" rx="29" fill="#ef4444"/>
    <text x="110" y="653" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#fff">开始抽奖</text>
    <rect x="268" y="616" width="178" height="58" rx="29" fill="#22a06b"/>
    <text x="304" y="653" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#fff">保存设置</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="42" y="724" width="436" height="122" rx="34" fill="#ffffff" fill-opacity=".8" stroke="#fff" stroke-width="2"/>
    <text x="74" y="780" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#1e293b">抽奖记录</text>
    <text x="74" y="818" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19" fill="#64748b">#16 · 二等奖 · 剩余 4</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="42" y="876" width="436" height="74" rx="37" fill="#ffffff" fill-opacity=".86" stroke="#fff" stroke-width="2"/>
    <circle cx="94" cy="913" r="34" fill="#e7f0ff"/>
    <text x="72" y="922" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#2f80ed">总览</text>
    <text x="158" y="922" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#0f172a">控制</text>
    <text x="246" y="922" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#0f172a">奖池</text>
    <text x="334" y="922" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#0f172a">记录</text>
  </g>
</svg>
